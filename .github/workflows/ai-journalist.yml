name: Autonomous AI Journalist (Daily)

on:
  schedule:
    # Runs at 23:30 UTC every day, which is exactly 5:00 AM IST (Indian Standard Time)
    - cron: '30 23 * * *'
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  write-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Autonomous AI Journalist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai-journalist.js

      - name: Run Authentic Image Search Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/image-agent.js

      - name: Generate Sitemap
        run: node generate-sitemap.js

      - name: Commit and Push New Articles
        run: |
          git config --global user.name "Int3lion AI Journalist"
          git config --global user.email "ai-agent@intelion.blog"
          
          git add src/data/posts.json
          git add public/sitemap.xml
          
          # Only commit if there are actually changes to avoid failing the action
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "🤖 Auto-published 5 new SEO tech articles"
            git push origin master
          fi
